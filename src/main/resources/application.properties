spring.application.name=BarberiaAPI
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barberia_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
security.jwt.secret-key=${JWT_SECRET:QmFyYmVyaWFBUElDbGF2ZUxvY2FsRGVtbzIwMjZDYW1iaWFybGE=}
app.admin.login=${ADMIN_LOGIN:admin@barberia.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.zone=America/El_Salvador
springdoc.swagger-ui.path=/swagger-ui.html
